name: Validate uploaded Majlis Engineer archive

on:
  push:
    branches: [ "feature/dxf-and-cost-summary" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract uploaded source archive
        run: |
          mkdir -p /tmp/majlis-source
          unzip -q Majlis-Engineer-project-v2.zip -d /tmp/majlis-source
          test -f /tmp/majlis-source/Majlis-Engineer/gradlew
          chmod +x /tmp/majlis-source/Majlis-Engineer/gradlew

      - name: Run JVM unit tests
        working-directory: /tmp/majlis-source/Majlis-Engineer
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: /tmp/majlis-source/Majlis-Engineer
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: majlis-engineer-v2-debug-apk
          path: /tmp/majlis-source/Majlis-Engineer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
